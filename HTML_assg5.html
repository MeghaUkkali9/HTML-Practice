<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Radio button example</title>
</head>
<body>
	
	<h1>HTML Assignment</h1>
	<hr>
	<br>
	
	<form action="">
		<label>UserName: <input type="text" name="name"></label><br>
		<h4>Select Light bulbs</h4>
		<label>
			<input type="checkbox" name="lightbulbs" value="fourlightbulbs" checked="checked"> 
			Four 25-watt light bulbs for $2.39 
		</label><br>
		<label>
			<input type="checkbox" name="lightbulbs" value="Eightlightbulbs">
			Eight 25-watt light bulbs for $4.29
		</label><br>
		<label>
			<input type="checkbox" name="lightbulbs" value="FourLonglightbulbs">
			Four 25-watt Long-life light bulbs for $3.95
		</label><br>
		<label>
			<input type="checkbox" name="lightbulbs" value="EightLonglightbulbs">
			Eight 25-watt Long-life light bulbs for $7.49
		</label><br>

		<h4>Select card</h4>
		<label>
			<input type="radio" name="cards" value="visa" checked="checked">
			Visa
		</label><br>
		<label>
			<input type="radio" name="cards" value="mastercard" >
			Master Card
		</label><br>
		<label>
			<input type="radio" name="cards" value="discover" >
			Discover
		</label><br>
	</form>

     		 src="http://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01 Transitional" height="31" width="88"></a>
  		</p>
	
</body>
</html>
